services:
  - type: web
    name: truthlens-api
    env: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
